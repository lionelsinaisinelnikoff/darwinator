{% extends "base.html" %}
{% block title %}Edit Idea{% endblock %}
{% block content %}
<h1 class="section-title mb-2">Edit Idea</h1>
<p class="text-muted mb-4">Update the name or description of your submission.</p>
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Idea Name</label>
            <input type="text" name="name" class="form-control" value="{{ idea.name }}" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4" required>{{ idea.description }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('submit') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
